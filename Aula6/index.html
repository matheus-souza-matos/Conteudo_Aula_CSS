<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FlexBox CSS</title>
</head>
<body>
    <h1>Flex Items CSS</h1>
    <p>Exemplos de Flex Items: </p>

    <!-- Exemplo de Flex Items - Order -->
    <div class="ex1">
        <div style="order: 4;">Item 1</div>
        <div style="order: 2;">Item 2</div>
        <div style="order: 1;">Item 3</div>
        <div style="order: 3;">Item 4</div>
    </div>

    <hr>

    <!-- Exemplo de Flex Items - Flex-Grow -->
    <div class="ex2">
        <div style="flex-grow: 4;">Item 1</div>
        <div style="flex-grow: 2;">Item 2</div>
        <div style="flex-grow: 1;">Item 3</div>
    </div>

    <hr>

    <!-- Exemplo de Flex Items - Flex-shrink -->
    <div class="ex3">
        <div>Item 1</div>
        <div style="flex-shrink: 2;">Item 2</div>
        <div>Item 3</div>
        <div style="flex-shrink: 2;">Item 4</div>
        <div>Item 5</div>
    </div>

    <hr>

    <!-- Exemplo de Flex Items - Flex-basis -->
    <div class="ex4">
        <div style="flex-basis: 400px;">Item 1</div>
        <div style="flex-basis: 200px;">Item 2</div>
        <div style="flex-basis: 200px;">Item 3</div>
        <div style="flex-basis: 200px;">Item 4</div>
    </div>

    <hr>

    <!-- Exemplo de align-self - Center -->
    <div class="ex5">
        <div id="it1">Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <hr>

    <!-- Exemplo de align-self - flex start e align self flex end -->
    <div class="ex6">
        <div id="item1">Item 1</div>
        <div id="item2">Item 2</div>
        <div id="item3">Item 3</div>
        <div>Item 4</div>
    </div>
</body>
</html>
